<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Valery</title>
  <!-- ID YouTube: T89IqbAF9Ik (YOKO - Álvaro Díaz) -->

  <!-- ===== SEO / Open Graph ===== -->
  <meta name="description" content="Un regalo hecho con carino" />
  <meta property="og:title" content="Para Valery" />
  <meta property="og:description" content="Un regalo hecho con carino" />
  <meta property="og:image" content="foto1.jpg" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#E0559E" />

  <!-- ===== Google Fonts ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;600&display=swap"
    rel="stylesheet" />

  <style>
    /* =====================================================
       VARIABLES — cambia aqui colores facilmente
       ===================================================== */
    :root {
      --bg-start: #FFE8F0;
      --bg-mid: #FFF6EC;
      --bg-accent: #FFD9A6;

      --petal-main: #E0559E;
      --petal-alt: #D84B8E;
      --petal-light: #F07DC0;
      --petal-mote: #7A1F4B;
      --petal-border: #FFFFFF;
      --petal-center: #F4A93B;
      --leaf-color: #5B8C5A;

      --bokeh: rgba(255, 234, 184, 0.35);

      --name-color: #C2185B;
      --name-glow: #FFD700;

      --font-title: 'Great Vibes', cursive;
      --font-msg: 'Dancing Script', cursive;
      --font-ui: 'Quicksand', sans-serif;

      /* Duracion del ciclo en segundos */
      --cycle: 20s;
    }

    /* =====================================================
       RESET Y BASE
       ===================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-ui);
      background: linear-gradient(160deg,
          var(--bg-start) 0%,
          var(--bg-mid) 55%,
          var(--bg-accent) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      touch-action: manipulation;
      user-select: none;
    }

    /* =====================================================
       STAGE PRINCIPAL
       ===================================================== */
    #stage {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =====================================================
       PARTÍCULAS BOKEH
       ===================================================== */
    .bokeh-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bokeh {
      position: absolute;
      border-radius: 50%;
      background: var(--bokeh);
      animation: bokehFloat linear infinite;
      filter: blur(2px);
    }

    @keyframes bokehFloat {
      0% {
        transform: translateY(110vh) scale(0.8);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        transform: translateY(-20vh) scale(1.2);
        opacity: 0;
      }
    }

    /* =====================================================
       FLORES DECORATIVAS DE FONDO (SVG inline, fijas)
       ===================================================== */
    #flores-fondo {
      position: absolute;
      inset: 0;
      pointer-events: none;
      /* flores de fondo siempre debajo de todo el contenido */
      z-index: 2;
      overflow: hidden;
    }

    /* Cada flor decorativa tiene su propia animacion suave */
    .flor-deco {
      position: absolute;
      animation: florDecoSway ease-in-out infinite alternate;
      transform-origin: 50% 100%;
    }

    @keyframes florDecoSway {
      0% {
        transform: rotate(-3deg) scale(1);
      }

      100% {
        transform: rotate(3deg) scale(1.03);
      }
    }

    @keyframes florDecoFade {

      0%,
      100% {
        opacity: 0.55;
      }

      50% {
        opacity: 0.85;
      }
    }

    /* Rosa pequena de 5 petalos — reutilizable via JS */
    .rosa-deco {
      position: absolute;
      pointer-events: none;
      animation: rosaDrift ease-in-out infinite alternate;
      transform-origin: 50% 80%;
    }

    @keyframes rosaDrift {
      0% {
        transform: rotate(-4deg) scale(1);
        opacity: 0.6;
      }

      100% {
        transform: rotate(4deg) scale(1.05);
        opacity: 0.85;
      }
    }

    /* =====================================================
       SECCIÓN 1 — DEDICATORIA
       ===================================================== */
    #dedicatoria {
      position: absolute;
      inset: 0;
      display: flex;
      /* columna para que justify-content: flex-start empuje hacia arriba */
      flex-direction: column;
      align-items: center;
      /* centrado horizontal */
      justify-content: flex-start;
      /* empieza desde arriba */
      padding-top: 5vh;
      z-index: 30;
      pointer-events: none;
    }

    #dedicatoria h1 {
      font-family: var(--font-title);
      font-size: clamp(2.5rem, 8vw, 5rem);
      color: var(--name-color);
      text-shadow:
        0 0 20px rgba(255, 215, 0, 0.6),
        0 2px 8px rgba(194, 24, 91, 0.4);
      animation: dedicatoriaAnim var(--cycle) ease-in-out infinite;
      text-align: center;
      padding: 0 1rem;
    }

    /* 0-4s visible, 4-5s sale → 0%-25% del ciclo de 20s */
    @keyframes dedicatoriaAnim {
      0% {
        opacity: 0;
        transform: scale(0.88) translateY(12px);
      }

      4% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }

      20% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }

      25% {
        opacity: 0;
        transform: scale(1.04) translateY(-6px);
      }

      88% {
        opacity: 0;
      }

      92% {
        opacity: 0.2;
      }

      100% {
        opacity: 0;
        transform: scale(0.88) translateY(12px);
      }
    }

    /* =====================================================
       SECCIÓN 2-4 — LIRIOS PRINCIPALES + FOTOS
       ===================================================== */
    #flores-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 5vh;
      gap: clamp(10px, 3vw, 40px);
      /* flores principales debajo del texto final */
      z-index: 8;
    }

    .lirio-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: filter 0.3s;
    }

    .lirio-container.small {
      width: clamp(80px, 18vw, 160px);
    }

    .lirio-container.main {
      width: clamp(110px, 24vw, 220px);
    }

    .lirio-svg {
      width: 100%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 4px 16px rgba(224, 85, 158, 0.3));
    }

    /* Pétalos: apertura pétalo a pétalo */
    .petalo {
      transform-origin: 50% 100%;
      animation: petalOpen var(--cycle) ease-in-out infinite;
    }

    /* Ciclo 20s: 0-4s dedicatoria, 4-10s apertura flores, 10-16s abierto+fotos, 11-19s finale */

    /* Delays escalonados lirio 1 — empiezan a los ~4s (20% del ciclo) */
    .lirio-1 .petalo:nth-child(1) {
      animation-delay: 0s;
    }

    .lirio-1 .petalo:nth-child(2) {
      animation-delay: 0.2s;
    }

    .lirio-1 .petalo:nth-child(3) {
      animation-delay: 0.4s;
    }

    .lirio-1 .petalo:nth-child(4) {
      animation-delay: 0.6s;
    }

    .lirio-1 .petalo:nth-child(5) {
      animation-delay: 0.8s;
    }

    .lirio-1 .petalo:nth-child(6) {
      animation-delay: 1.0s;
    }

    /* Delays escalonados lirio 2 */
    .lirio-2 .petalo:nth-child(1) {
      animation-delay: 0.5s;
    }

    .lirio-2 .petalo:nth-child(2) {
      animation-delay: 0.7s;
    }

    .lirio-2 .petalo:nth-child(3) {
      animation-delay: 0.9s;
    }

    .lirio-2 .petalo:nth-child(4) {
      animation-delay: 1.1s;
    }

    .lirio-2 .petalo:nth-child(5) {
      animation-delay: 1.3s;
    }

    .lirio-2 .petalo:nth-child(6) {
      animation-delay: 1.5s;
    }

    /* Delays escalonados lirio 3 */
    .lirio-3 .petalo:nth-child(1) {
      animation-delay: 0.25s;
    }

    .lirio-3 .petalo:nth-child(2) {
      animation-delay: 0.45s;
    }

    .lirio-3 .petalo:nth-child(3) {
      animation-delay: 0.65s;
    }

    .lirio-3 .petalo:nth-child(4) {
      animation-delay: 0.85s;
    }

    .lirio-3 .petalo:nth-child(5) {
      animation-delay: 1.05s;
    }

    .lirio-3 .petalo:nth-child(6) {
      animation-delay: 1.25s;
    }

    /* 0-5s cerrado (25%), 5-11s se abre (55%), 11-17s abierto meciendose (85%), cierra */
    @keyframes petalOpen {
      0% {
        transform: scaleY(0.05) scaleX(0.3);
        opacity: 0.3;
      }

      25% {
        transform: scaleY(0.05) scaleX(0.3);
        opacity: 0.3;
      }

      52% {
        transform: scaleY(1) scaleX(1);
        opacity: 1;
      }

      68% {
        transform: scaleY(1) scaleX(1) rotate(-2deg);
      }

      72% {
        transform: scaleY(1) scaleX(1) rotate(2deg);
      }

      76% {
        transform: scaleY(1) scaleX(1) rotate(-1deg);
      }

      88% {
        transform: scaleY(1) scaleX(1) rotate(0deg);
      }

      100% {
        transform: scaleY(0.05) scaleX(0.3);
        opacity: 0.3;
      }
    }

    /* Resplandor detras del lirio */
    .lirio-glow {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150%;
      height: 150%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 169, 59, 0.28) 0%, transparent 70%);
      animation: glowPulse var(--cycle) ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes glowPulse {

      0%,
      25% {
        opacity: 0;
      }

      52% {
        opacity: 1;
      }

      88% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* Hojas */
    .hoja {
      fill: var(--leaf-color);
      animation: hojaFade var(--cycle) ease-in-out infinite;
    }

    @keyframes hojaFade {

      0%,
      25% {
        opacity: 0;
      }

      42% {
        opacity: 1;
      }

      88% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* =====================================================
       MARCOS DE FOTO (circulares, tipo polaroid)
       ===================================================== */
    .foto-frame {
      position: absolute;
      /* centrado sobre el pistilo */
      top: 38%;
      left: 50%;
      transform: translateX(-50%) translateY(-50%) scale(0);
      /* Tamano en viewport units para que sea grande independientemente del lirio */
      width: clamp(160px, 27vw, 260px);
      height: clamp(160px, 27vw, 260px);
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.92);
      box-shadow:
        0 0 0 3px rgba(224, 85, 158, 0.5),
        0 8px 32px rgba(194, 24, 91, 0.35),
        0 0 0 6px rgba(255, 255, 255, 0.25);
      cursor: pointer;
      /* encima de los petalos */
      z-index: 10;
      animation: fotoReveal var(--cycle) ease-in-out infinite;
      transition: box-shadow 0.3s, transform 0.3s;
    }

    /* El lirio central tiene foto aun mas grande */
    .lirio-container.main .foto-frame {
      width: clamp(200px, 33vw, 330px);
      height: clamp(200px, 33vw, 330px);
      top: 34%;
    }

    .foto-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: fotoZoom var(--cycle) ease-in-out infinite;
      pointer-events: none;
    }

    /* Fallback si no carga la foto: flor SVG suave */
    .foto-fallback {
      display: none;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center,
          #FFE8F0 0%, #E0559E 60%, #C2185B 100%);
      align-items: center;
      justify-content: center;
    }

    .foto-fallback svg {
      width: 55%;
      height: 55%;
      opacity: 0.9;
    }

    /* Fotos aparecen cuando lirio abierto: ~52%-88% del ciclo de 20s */
    @keyframes fotoReveal {

      0%,
      50% {
        transform: translateX(-50%) translateY(-50%) scale(0);
        opacity: 0;
      }

      56% {
        transform: translateX(-50%) translateY(-50%) scale(1);
        opacity: 1;
      }

      88% {
        transform: translateX(-50%) translateY(-50%) scale(1);
        opacity: 1;
      }

      100% {
        transform: translateX(-50%) translateY(-50%) scale(0);
        opacity: 0;
      }
    }

    @keyframes fotoZoom {

      0%,
      50% {
        transform: scale(1);
      }

      56% {
        transform: scale(1);
      }

      74% {
        transform: scale(1.06);
      }

      88% {
        transform: scale(1);
      }

      100% {
        transform: scale(1);
      }
    }

    .foto-frame:active,
    .foto-frame.tapped {
      box-shadow:
        0 0 0 4px var(--petal-main),
        0 8px 32px rgba(194, 24, 91, 0.5);
      transform: translateX(-50%) translateY(-50%) scale(1.08) !important;
    }

    /* =====================================================
       PÉTALOS CAYENDO
       ===================================================== */
    #petalos-cayendo {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
    }

    .petalo-caida {
      position: absolute;
      top: -5%;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(ellipse, #F07DC0 0%, var(--petal-main) 60%, var(--petal-mote) 100%);
      opacity: 0;
      animation: petaloCae var(--cycle) ease-in-out infinite;
    }

    /* Petalos caen entre 40%-78% del ciclo (8s-15.6s sobre 20s) */
    @keyframes petaloCae {

      0%,
      40% {
        opacity: 0;
        transform: translateX(0) translateY(-10px) rotate(0deg);
      }

      43% {
        opacity: 0.9;
      }

      75% {
        opacity: 0.7;
        transform: translateX(var(--drift, 40px)) translateY(110vh) rotate(var(--spin, 360deg));
      }

      78%,
      100% {
        opacity: 0;
        transform: translateX(var(--drift, 40px)) translateY(115vh) rotate(var(--spin, 380deg));
      }
    }

    /* =====================================================
       FLORES FLOTANTES (rosas pequenas generadas por JS)
       ===================================================== */
    .rosa-flotante {
      position: absolute;
      pointer-events: none;
      animation: rosaFlota ease-in-out infinite alternate;
      transform-origin: 50% 100%;
    }

    @keyframes rosaFlota {
      0% {
        transform: translateY(0px) rotate(-5deg);
        opacity: 0.5;
      }

      100% {
        transform: translateY(-14px) rotate(5deg);
        opacity: 0.8;
      }
    }

    /* =====================================================
       SECCIÓN 5 — NOMBRE FINAL
       ===================================================== */
    #finale {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* "Valery" aparece en el tercio superior, no tapa las fotos */
      justify-content: flex-start;
      padding-top: 5vh;
      z-index: 35;
      pointer-events: none;
      text-align: center;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    #nombre-final {
      font-family: var(--font-title);
      font-size: clamp(3.5rem, 14vw, 9rem);
      color: var(--name-color);
      text-shadow:
        0 0 30px var(--name-glow),
        0 0 60px rgba(255, 215, 0, 0.5),
        0 0 90px rgba(255, 215, 0, 0.25),
        0 4px 12px rgba(194, 24, 91, 0.5);
      line-height: 1.1;
      animation: nombreFinal var(--cycle) ease-in-out infinite;
    }

    .sub-message {
      font-family: var(--font-msg);
      font-size: clamp(1rem, 3.5vw, 1.8rem);
      color: var(--petal-mote);
      margin-top: 0.6em;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.8);
      line-height: 1.5;
      max-width: 600px;
      animation: subMsgAnim var(--cycle) ease-in-out infinite;
    }

    /* Aparece a los ~11s (55%) y se queda hasta el final (96%) del ciclo de 20s */
    @keyframes nombreFinal {

      0%,
      53% {
        opacity: 0;
        transform: scale(0.7) translateY(22px);
      }

      58% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }

      94% {
        opacity: 1;
        transform: scale(1.02) translateY(0);
      }

      100% {
        opacity: 0;
        transform: scale(1.05) translateY(-10px);
      }
    }

    @keyframes subMsgAnim {

      0%,
      56% {
        opacity: 0;
        transform: translateY(16px);
      }

      61% {
        opacity: 1;
        transform: translateY(0);
      }

      94% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* Halo dorado — sincronizado con nombreFinal */
    #halo {
      position: absolute;
      width: clamp(250px, 70vw, 600px);
      height: clamp(250px, 70vw, 600px);
      border-radius: 50%;
      background: radial-gradient(circle,
          rgba(255, 215, 0, 0.22) 0%,
          rgba(255, 180, 0, 0.08) 50%,
          transparent 75%);
      animation: haloAnim var(--cycle) ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes haloAnim {

      0%,
      53% {
        opacity: 0;
        transform: scale(0.5);
      }

      58% {
        opacity: 1;
        transform: scale(1);
      }

      94% {
        opacity: 1;
        transform: scale(1.1);
      }

      100% {
        opacity: 0;
        transform: scale(1.2);
      }
    }

    /* =====================================================
       BARRA DE PROGRESO
       ===================================================== */
    #progress-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, var(--petal-main), var(--name-glow));
      z-index: 100;
      border-radius: 0 2px 0 0;
    }



    /* Pulso de brillo al tocar lirio */
    .lirio-container.pulse .petalo {
      animation:
        petalOpen var(--cycle) ease-in-out infinite,
        petalPulse 0.5s ease-out;
    }

    @keyframes petalPulse {
      0% {
        filter: brightness(1);
      }

      30% {
        filter: brightness(1.9) saturate(1.6);
      }

      100% {
        filter: brightness(1);
      }
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */
    @media (max-width: 480px) {
      .lirio-container.small {
        width: 24vw;
      }

      .lirio-container.main {
        width: 34vw;
      }

      #flores-wrapper {
        padding-bottom: 2vh;
        gap: 2vw;
      }

      .foto-frame {
        width: clamp(120px, 36vw, 170px);
        height: clamp(120px, 36vw, 170px);
      }

      .lirio-container.main .foto-frame {
        width: clamp(155px, 46vw, 210px);
        height: clamp(155px, 46vw, 210px);
      }

      /* En movil el texto baja un poco mas */
      #dedicatoria {
        padding-top: 5vh;
      }

      #finale {
        padding-top: 3vh;
      }
    }

    @media (min-width: 1200px) {
      .lirio-container.small {
        width: 140px;
      }

      .lirio-container.main {
        width: 200px;
      }
    }

    /* =====================================================
       OVERLAY DE INICIO
       ===================================================== */
    #tap-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 232, 240, 0.93);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      gap: 1rem;
      transition: opacity 0.6s;
    }

    #tap-overlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Flores decorativas en el overlay */
    #tap-overlay .overlay-flowers {
      display: flex;
      gap: 1.2rem;
      align-items: flex-end;
      margin-bottom: 0.5rem;
    }

    #tap-overlay .tap-title {
      font-family: var(--font-title);
      font-size: clamp(2rem, 7vw, 4.5rem);
      color: var(--name-color);
      text-shadow: 0 0 24px rgba(255, 215, 0, 0.5);
    }

    #tap-overlay .tap-hint {
      font-family: var(--font-ui);
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      color: var(--petal-mote);
      opacity: 0.8;
    }

    /* Flor SVG que flota en el overlay */
    .overlay-flower-svg {
      animation: floatFlower ease-in-out infinite alternate;
    }

    .overlay-flower-svg:nth-child(2) {
      animation-duration: 2.2s;
      animation-delay: 0.4s;
    }

    .overlay-flower-svg:nth-child(3) {
      animation-duration: 1.8s;
      animation-delay: 0.8s;
    }

    @keyframes floatFlower {
      0% {
        transform: translateY(0) scale(1);
      }

      100% {
        transform: translateY(-14px) scale(1.08);
      }
    }
  </style>
</head>

<body>
  <audio src="yoko.mp3" autoplay loop style="display:none;"></audio>

  <!-- =====================================================
     OVERLAY DE INICIO
     ===================================================== -->
  <div id="tap-overlay" role="button" aria-label="Toca para comenzar">
    <!-- Tres rosas SVG decorativas -->

  <!-- =====================================================
     JAVASCRIPT PRINCIPAL
     ===================================================== -->
  <script>
    /* =========================================================
       CONFIG
       ========================================================= */
    const CONFIG = {
      cycleDuration: 15,   // segundos del loop
      bokehCount: 25,   // particulas bokeh
      petalosCount: 7,   // petalos que caen
      rosasCount: 10,   // rosas flotantes pequenas en el fondo
    };

    /* =========================================================
       BOKEH
       ========================================================= */
    (function initBokeh() {
      const layer = document.getElementById('bokehLayer');
      for (let i = 0; i < CONFIG.bokehCount; i++) {
        const b = document.createElement('div');
        b.classList.add('bokeh');
        const sz = 18 + Math.random() * 55;
        b.style.cssText = `
        width:${sz}px; height:${sz}px;
        left:${Math.random() * 100}%;
        animation-duration:${8 + Math.random() * 14}s;
        animation-delay:${Math.random() * -22}s;
        opacity:${0.18 + Math.random() * 0.22};
      `;
        layer.appendChild(b);
      }
    })();

    /* =========================================================
       PÉTALOS CAYENDO
       ========================================================= */
    (function initPetalosCaida() {
      const cont = document.getElementById('petalos-cayendo');
      for (let i = 0; i < CONFIG.petalosCount; i++) {
        const p = document.createElement('div');
        p.classList.add('petalo-caida');
        const w = 12 + Math.random() * 16;
        const h = w * (1.3 + Math.random() * 0.5);
        const drift = (Math.random() < 0.5 ? -1 : 1) * (30 + Math.random() * 70);
        const spin = 200 + Math.random() * 400;
        const delay = (i * 0.7) + Math.random() * 1.2;
        p.style.cssText = `
        left:${15 + Math.random() * 70}%;
        width:${w}px; height:${h}px;
        --drift:${drift}px;
        --spin:${spin}deg;
        animation-delay:${-CONFIG.cycleDuration + delay}s;
      `;
        cont.appendChild(p);
      }
    })();

    /* =========================================================
       ROSAS FLOTANTES DECORATIVAS (SVG pequenas, posicion aleatoria)
       ========================================================= */
    (function initRosasFlotantes() {
      const cont = document.getElementById('rosas-flotantes');
      // paleta de colores de petalos
      const cols = ['#E0559E', '#D84B8E', '#F07DC0', '#C2185B'];
      const sizes = [30, 38, 44, 26, 34];

      for (let i = 0; i < CONFIG.rosasCount; i++) {
        const sz = sizes[i % sizes.length];
        const col1 = cols[i % cols.length];
        const col2 = cols[(i + 1) % cols.length];
        const left = 3 + Math.random() * 94;
        const top = 3 + Math.random() * 88;
        const dur = 3 + Math.random() * 4;
        const delay = Math.random() * -6;
        const rot = Math.random() * 360;

        const wrapper = document.createElement('div');
        wrapper.classList.add('rosa-flotante');
        wrapper.style.cssText = `
        left:${left}%; top:${top}%;
        width:${sz}px; height:${sz * 1.3}px;
        animation-duration:${dur}s;
        animation-delay:${delay}s;
        z-index:2;
      `;

        // Mini flor SVG de 5 petalos
        wrapper.innerHTML = `
        <svg viewBox="0 0 60 75" width="${sz}" height="${sz * 1.25}"
             xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
             style="transform:rotate(${rot}deg)">
          <line x1="30" y1="75" x2="30" y2="48" stroke="#5B8C5A" stroke-width="2.5" stroke-linecap="round"/>
          <ellipse cx="19" cy="62" rx="10" ry="4" transform="rotate(-35 19 62)" fill="#5B8C5A" opacity="0.7"/>
          <ellipse cx="30" cy="24" rx="8" ry="24" transform="rotate(-60 30 48)" fill="${col1}" opacity="0.65"/>
          <ellipse cx="30" cy="24" rx="8" ry="24" transform="rotate(-20 30 48)" fill="${col2}" opacity="0.65"/>
          <ellipse cx="30" cy="24" rx="8" ry="24" transform="rotate(20 30 48)"  fill="${col1}" opacity="0.65"/>
          <ellipse cx="30" cy="24" rx="8" ry="24" transform="rotate(60 30 48)"  fill="${col2}" opacity="0.65"/>
          <ellipse cx="30" cy="24" rx="8" ry="24" transform="rotate(100 30 48)" fill="${col1}" opacity="0.65"/>
          <circle cx="30" cy="48" r="7" fill="#F4A93B" opacity="0.9"/>
          <circle cx="30" cy="48" r="3" fill="#FFD700" opacity="0.8"/>
        </svg>
      `;
        cont.appendChild(wrapper);
      }
    })();

    /* =========================================================
       BARRA DE PROGRESO
       ========================================================= */
    (function initProgress() {
      const bar = document.getElementById('progress-bar');
      let ts0 = null;
      const dur = CONFIG.cycleDuration * 1000;
      function step(ts) {
        if (!ts0) ts0 = ts;
        bar.style.width = (((ts - ts0) % dur) / dur * 100) + '%';
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();

    /* =========================================================
       AUDIO
       ========================================================= */
    /* Audio gestionado por el bloque YouTube embebido arriba */

    /* =========================================================
       OVERLAY DE INICIO
       ========================================================= */
    (function initOverlay() {
      const overlay = document.getElementById('tap-overlay');
      function dismiss() {
        overlay.classList.add('fade-out');
        setTimeout(() => overlay.remove(), 700);
        window._tryPlayAudio && window._tryPlayAudio();
      }
      overlay.addEventListener('click', dismiss);
      overlay.addEventListener('touchstart', dismiss, { passive: true });
    })();



    /* =========================================================
       INTERACCION FOTOS
       ========================================================= */
    document.querySelectorAll('.foto-frame').forEach(frame => {
      function onTap(e) {
        e.stopPropagation();
        frame.classList.add('tapped');
        setTimeout(() => frame.classList.remove('tapped'), 400);
      }
      frame.addEventListener('click', onTap);
      frame.addEventListener('touchstart', onTap, { passive: true });
    });

    /* =========================================================
       INTERACCION LIRIOS (pulso de brillo)
       ========================================================= */
    document.querySelectorAll('.lirio-container').forEach(lirio => {
      function onTap(e) {
        if (e.target.closest('.foto-frame')) return;
        lirio.classList.add('pulse');
        setTimeout(() => lirio.classList.remove('pulse'), 600);
      }
      lirio.addEventListener('click', onTap);
      lirio.addEventListener('touchstart', onTap, { passive: true });
    });
  </script>
